<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bravelly Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <!-- Navbar -->
  <nav class="bg-white shadow p-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
    <h1 class="text-2xl font-bold text-green-700">Bravelly Bar</h1>
    <div class="text-sm text-gray-600 space-y-1 sm:text-right">
      <p>Email: <a href="mailto:bravellybar@gmail.com" class="text-blue-600">bravellybar@gmail.com</a></p>
      <p>Instagram: <a href="https://instagram.com/braveelly_oli" class="text-blue-600">@braveelly_oli</a></p>
      <p>Facebook: <a href="https://facebook.com/BraveellyOli" class="text-blue-600">Braveelly Oli</a></p>
    </div>
  </nav>

  <!-- Search -->
  <div class="p-4">
    <input type="text" id="searchInput" placeholder="Search beer..." class="w-full px-4 py-2 border rounded-lg shadow focus:outline-none focus:ring focus:border-blue-300">
  </div>

  <!-- Beers Grid -->
  <div id="beersGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <!-- Beers will be rendered here -->
  </div>

  <!-- Cart Button -->
  <div class="fixed bottom-4 right-4">
    <button onclick="toggleCart()" class="bg-green-600 text-white px-4 py-2 rounded-full shadow-lg">
      🛒 View Cart (<span id="cartCount">0</span>)
    </button>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg w-11/12 max-w-lg shadow-lg overflow-y-auto max-h-[90vh]">
      <h2 class="text-xl font-bold mb-4 text-green-700">Your Cart</h2>
      <div id="cartItems" class="space-y-4"></div>
      <div class="border-t pt-4 mt-4">
        <p class="text-right font-bold">Total: <span id="cartTotal">0</span> RWF</p>
      </div>
      <form id="checkoutForm" class="mt-4 space-y-3">
        <input type="text" name="name" placeholder="Full Name" required class="w-full border px-3 py-2 rounded">
        <input type="tel" name="phone" placeholder="Phone Number" required class="w-full border px-3 py-2 rounded">
        <div class="flex justify-between">
          <button type="button" onclick="toggleCart()" class="bg-gray-500 text-white px-4 py-2 rounded">Close</button>
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Checkout</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS -->
  <script>
    const beers = [
      "Skol", "Primus", "Heineken", "Amstel", "Mützig", "Turbo King", "Guinness", "Virunga Mist", "Kilimanjaro", "Tusker",
      "Beck’s", "Stella Artois", "Budweiser", "Corona", "Castle Lite", "Harp", "Smirnoff Ice", "Savanna", "Hunter’s Gold", "Strongbow",
      "Redds", "White Cap", "Bell Lager", "Senator", "Club Beer", "Chibuku", "Eagle Lager", "Tusker Lite", "Castle Milk Stout", "Speranza",
      "Amarula", "Drostdy-Hof", "Four Cousins", "Jameson Beer", "Bavaria", "Kaiser", "Warsteiner", "Carlsberg", "Molson", "Peroni",
      "Sapporo", "Tsingtao", "Tiger", "Zambezi", "Efes", "Bud Light", "Modelo", "Lite Beer", "Red Stripe", "Pilsner"
    ].map((name, i) => ({
      name,
      price: 1000 + (i % 10) * 200,
      img: `https://source.unsplash.com/400x300/?beer&sig=${i}`
    }));

    let cart = [];

    function renderBeers(list) {
      const container = document.getElementById('beersGrid');
      container.innerHTML = '';
      list.forEach((beer, index) => {
        const div = document.createElement('div');
        div.className = 'bg-white shadow rounded-lg p-4 flex flex-col items-center';
        div.innerHTML = `
          <img src="${beer.img}" alt="${beer.name}" class="w-full h-48 object-cover rounded-md mb-2">
          <h2 class="text-lg font-semibold">${beer.name}</h2>
          <p class="text-gray-700">Price: ${beer.price} RWF</p>
          <button class="mt-2 bg-green-600 text-white px-4 py-2 rounded" onclick="addToCart(${index})">Add to Cart</button>
        `;
        container.appendChild(div);
      });
    }

    function addToCart(index) {
      const beer = beers[index];
      const existing = cart.find(item => item.name === beer.name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...beer, qty: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const cartItems = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');
      cartItems.innerHTML = '';
      let total = 0;

      cart.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center border p-2 rounded';
        const itemTotal = item.qty * item.price;
        total += itemTotal;

        div.innerHTML = `
          <div>
            <p class="font-semibold">${item.name}</p>
            <p>${item.qty} x ${item.price} = ${itemTotal} RWF</p>
          </div>
          <button class="text-red-500" onclick="removeFromCart(${i})">Remove</button>
        `;
        cartItems.appendChild(div);
      });

      cartCount.textContent = cart.reduce((sum, i) => sum + i.qty, 0);
      cartTotal.textContent = total;
    }

    function toggleCart() {
      document.getElementById('cartModal').classList.toggle('hidden');
    }

    document.getElementById('checkoutForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (cart.length === 0) return alert("Cart is empty!");
      alert("Order placed successfully!");
      cart = [];
      updateCartUI();
      toggleCart();
      this.reset();
    });

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', function () {
      const keyword = this.value.toLowerCase();
      const filtered = beers.filter(beer => beer.name.toLowerCase().includes(keyword));
      renderBeers(filtered);
    });

    // Initial render
    renderBeers(beers);
  </script>
</body>
</html>
